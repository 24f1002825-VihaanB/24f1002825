{% extends "base.html" %}
{% block title %}My Profile – Admin{% endblock %}

{% block content %}
<div class="d-flex justify-content-center">
  <div class="col-12 col-md-6 col-lg-5">

    <div class="card shadow-sm">
      <div class="card-header bg-white">
        <h5 class="mb-0">My Profile (Admin)</h5>
      </div>

      <div class="card-body">
        <form method="post">
          <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text"
                   name="name"
                   class="form-control"
                   value="{{ admin.name }}"
                   required>
          </div>

          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email"
                   class="form-control"
                   value="{{ admin.email }}"
                   disabled>
            <div class="form-text">
              Email cannot be changed here.
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100 mt-2">
            Save changes
          </button>
        </form>
      </div>
    </div>

  </div>
</div>
{% endblock %}
