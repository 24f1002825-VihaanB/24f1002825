{% extends "base.html" %}
{% block title %}Patient Registration – HMS{% endblock %}

{% block content %}
<div class="d-flex justify-content-center">
  <div class="col-12 col-md-6 col-lg-5">

    <div class="card shadow-sm">
      <div class="card-header bg-white">
        <h5 class="mb-0">Patient Registration</h5>
      </div>

      <div class="card-body">

        <form method="post">

          <!-- Name -->
          <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input
              type="text"
              name="name"
              class="form-control"
              required
            >
          </div>

          <!-- Email -->
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input
              type="email"
              name="email"
              class="form-control"
              placeholder="you@example.com"
              required
            >
          </div>

          <!-- Password -->
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input
              type="password"
              name="password"
              class="form-control"
              required
            >
          </div>

          <!-- Gender -->
          <div class="mb-3">
            <label class="form-label">Gender</label>
            <select name="gender" class="form-select">
              <option value="" selected>Prefer not to say</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <!-- Address -->
          <div class="mb-3">
            <label class="form-label">Address</label>
            <input
              type="text"
              name="address"
              class="form-control"
              placeholder="Your home address"
            >
          </div>

          <!-- Medical Info Section -->
          <hr class="my-4">
          <h6 class="fw-semibold mb-3">Medical Details (Optional)</h6>

          <!-- Medical History -->
          <div class="mb-3">
            <label class="form-label">Past / Existing Conditions</label>
            <textarea
              name="medical_history"
              class="form-control"
              rows="3"
              placeholder="E.g. diabetes, hypertension, surgeries, chronic illnesses"
            ></textarea>
          </div>

          <!-- Allergies -->
          <div class="mb-3">
            <label class="form-label">Allergies</label>
            <input
              type="text"
              name="allergies"
              class="form-control"
              placeholder="E.g. penicillin, nuts, pollen, none"
            >
          </div>

          <!-- Medications -->
          <div class="mb-3">
            <label class="form-label">Current Medications</label>
            <input
              type="text"
              name="current_medications"
              class="form-control"
              placeholder="E.g. Amlodipine 5mg, Metformin 500mg"
            >
          </div>

          <!-- Submit -->
          <button type="submit" class="btn btn-primary w-100 mt-2">
            Register
          </button>

        </form>
      </div>

      <div class="card-footer bg-white d-flex justify-content-between align-items-center small text-muted">
        <span>Already registered?</span>
        <a href="{{ url_for('auth.patient_login') }}">Back to login</a>
      </div>
    </div>

  </div>
</div>
{% endblock %}
